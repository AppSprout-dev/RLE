name: CI

on:
  push:
    branches: [master, "feature/**"]
  pull_request:
    branches: [master, "feature/**"]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - uses: astral-sh/setup-uv@v4
      - run: uv pip install -e ".[dev,felix,mcp]" --system
      - name: Lint
        run: ruff check src/ tests/ scripts/
      - name: Type check
        run: mypy src/
      - name: Harness boundary (felix confined, no third-party harness code in tree)
        run: python scripts/check_harness_boundary.py

  test:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - uses: astral-sh/setup-uv@v4
      - run: uv pip install -e ".[dev,felix,mcp]" --system
      - name: Run tests
        run: pytest --tb=short -q

  # The environment must run any harness with the Felix SDK absent. This job
  # installs core + dev only and exercises the non-Felix paths end to end.
  test-no-felix:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - uses: astral-sh/setup-uv@v4
      - run: uv pip install -e ".[dev,mcp]" --system
      - name: Assert felix is absent
        run: python -c "import importlib.util as u, sys; sys.exit(0 if u.find_spec('felix_agent_sdk') is None else 'felix-agent-sdk leaked into the no-felix job')"
      - name: Core imports without felix
        run: python -c "import rle, rle.harness, rle.orchestration.game_loop, rle.testing, rle.mcp"
      - name: Run tests (Felix-only modules auto-skipped)
        run: pytest --tb=short -q
      - name: Harness list shows felix as unavailable, baseline available
        run: python scripts/run_benchmark.py --harness list
      - name: Smoke test baseline harness
        run: python scripts/run_benchmark.py --smoke-test --ticks 3 --harness baseline

  smoke-test:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - uses: astral-sh/setup-uv@v4
      - run: uv pip install -e ".[dev,felix,mcp]" --system
      - name: Smoke test felix + baseline + raw-grok matrix
        run: python scripts/run_benchmark.py --smoke-test --ticks 5 --harness felix --harness baseline --harness raw-grok

  # Contract test for the plugin API: an external harness package installed
  # straight from GitHub must appear in --harness list and pass smoke with
  # zero changes to this repo.
  external-plugin-contract:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - uses: astral-sh/setup-uv@v4
      - run: uv pip install -e ".[dev,mcp]" --system
      - name: Install the template harness from GitHub
        run: uv pip install "git+https://github.com/AppSprout-dev/rle-harness-template" --system
      - name: Template appears in the registry
        run: |
          python scripts/run_benchmark.py --harness list
          python scripts/run_benchmark.py --harness list | grep -q "^template "
      - name: Template passes smoke
        run: python scripts/run_benchmark.py --smoke-test --ticks 3 --harness template
