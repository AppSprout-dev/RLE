[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "rimworld-learning-environment"
version = "0.5.0"
description = "Harness x model benchmark: swappable agent harnesses manage a RimWorld colony"
readme = "README.md"
license = "MIT"
requires-python = ">=3.14"
# Core is framework-free: the environment (RIMAPI client, loop, scoring,
# scenarios, tracking, harness registry) runs any harness. Agent frameworks
# arrive through extras / external harness packages.
dependencies = [
    "httpx>=0.24",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
# The original Felix multi-agent harness (`--harness felix`).
felix = ["felix-agent-sdk>=0.3.0"]
anthropic = ["felix-agent-sdk[anthropic]"]
openai = ["felix-agent-sdk[openai]"]
local = ["felix-agent-sdk[local]"]
all = ["felix-agent-sdk[all]"]
# RimAPI MCP server for tool-using harnesses (`rle-mcp`).
mcp = ["mcp>=2.1"]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.24",
    "pytest-cov>=4.0",
    "ruff>=0.1.0",
    "mypy>=1.0",
    "types-PyYAML>=6.0",
]
viz = [
    "matplotlib>=3.5",
]
tracking = [
    "wandb>=0.15",
    "huggingface-hub>=0.20",
]

# Harness registry. RLE-authored harnesses live in this tree (baseline, felix,
# and the raw-grok model baseline). Product wrappers for third-party coding
# agents ship as their own packages and register under the same group.
[project.entry-points."rle.harnesses"]
baseline = "rle.harness.baseline:PLUGIN"
felix = "rle.harness.felix:PLUGIN"
raw-grok = "rle.harness.raw_grok:PLUGIN"

[project.scripts]
rle-mcp = "rle.mcp.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/rle"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.mypy]
python_version = "3.14"
strict = true

[[tool.mypy.overrides]]
module = ["wandb", "huggingface_hub", "mcp", "mcp.*"]
ignore_missing_imports = true

# wandb/huggingface_hub ship untyped APIs; when the tracking extra is
# installed locally, strict mode would otherwise flag every call into them
# (CI doesn't install the extra, so a type: ignore would be "unused" there).
[[tool.mypy.overrides]]
module = ["rle.tracking.wandb_logger", "rle.tracking.hf_logger"]
disallow_untyped_calls = false
